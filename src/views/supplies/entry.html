<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrée de Stock - PharmaStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    .hidden-section { display: none !important; }
    #barcode-scanner { width:100%; height:350px; border:2px solid var(--primary); border-radius:8px; background:#000; position:relative; z-index:1; }
    #barcode-scanner video { width:100%; height:100%; }
    .supply-list { max-height:240px; overflow-y:auto; background:#fff; border:1px solid var(--border); border-radius:var(--radius); }
    .supply-list-item { padding:.6rem .875rem; cursor:pointer; border-bottom:1px solid var(--border); font-size:.85rem; }
    .supply-list-item:last-child { border-bottom:none; }
    .supply-list-item:hover { background:var(--primary-light); color:var(--primary); }
    .quantity-input { font-size:1.1rem; text-align:center; }
    .supply-info { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:1rem; }
  </style>
</head>
<body>
<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar"></aside>
  <script src="../../assets/js/sidebar.js"></script>

  <!-- MAIN -->
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title"><i class="fas fa-arrow-circle-down me-2" style="color:var(--primary)"></i>Entrée de stock</h1>
      </div>
      <div class="topbar-right">
        <a href="list.html" class="btn btn-outline-secondary btn-sm">← Retour stock</a>
      </div>
    </div>

    <div class="content">
      <div style="max-width:640px;margin:0 auto;">

        <!-- Sélection de la fourniture -->
        <div id="selectSupplyContainer" class="hidden-section">
          <div class="card mb-3">
            <div class="card-header"><i class="fas fa-box me-2"></i>Sélectionner une fourniture</div>
            <div class="card-body">
              <div class="mb-3" id="scannerSection" style="display:none;">
                <label class="form-label" style="font-size:.8rem;font-weight:600;">Scanner un code-barres</label>
                <button type="button" class="btn btn-sm btn-outline-danger w-100 mb-2" id="stopScannerBtn" onclick="stopScanner()">
                  <i class="fas fa-times me-1"></i>Arrêter le scanner
                </button>
                <div id="barcode-scanner"></div>
                <div id="scan-result" class="mt-2"></div>
              </div>
              <button type="button" class="btn btn-primary w-100 mb-3" id="startScannerBtn" onclick="startScannerMode()">
                <i class="fas fa-barcode me-2"></i>Activer le scanner
              </button>
              <label class="form-label" style="font-size:.8rem;font-weight:600;">Ou rechercher une fourniture</label>
              <input type="text" class="form-control mb-2" id="supplySearch" placeholder="Référence ou désignation…" oninput="filterSupplies()">
              <div id="supplyList" class="supply-list"></div>
              <input type="hidden" id="supplySelect">
            </div>
          </div>
        </div>

        <!-- Carte du produit -->
        <div id="productDetailsContainer" class="hidden-section">
          <div class="card mb-3" style="border-left:3px solid var(--primary);">
            <div class="card-body">
              <div class="supply-info">
                <div class="info-item"><div class="info-label">Produit</div><div class="info-value" id="supplyName">…</div></div>
                <div class="info-item"><div class="info-label">Référence</div><div class="info-value" id="supplyRef">—</div></div>
                <div class="info-item"><div class="info-label">Stock actuel</div><div class="info-value" style="color:var(--primary);" id="supplyStock">0</div></div>
                <div class="info-item"><div class="info-label">Seuil d'alerte</div><div class="info-value" id="supplyAlert">—</div></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Formulaire d'entrée -->
        <div id="formContainer" class="hidden-section">
          <div class="card">
            <div class="card-header"><i class="fas fa-file-alt me-2"></i>Enregistrer une entrée</div>
            <div class="card-body">
              <form id="entryForm">
                <div class="mb-3">
                  <label class="form-label" style="font-size:.8rem;font-weight:600;">Quantité à recevoir <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <button class="btn btn-outline-secondary" type="button" onclick="decrementQuantity()"><i class="fas fa-minus"></i></button>
                    <input type="number" class="form-control quantity-input" id="quantity" name="quantity" min="1" max="1000" value="1" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="incrementQuantity()"><i class="fas fa-plus"></i></button>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label" style="font-size:.8rem;font-weight:600;">Date d'entrée <span class="text-danger">*</span></label>
                  <input type="date" class="form-control" id="entryDate" name="entryDate" required>
                </div>
                <div class="mb-3">
                  <label class="form-label" style="font-size:.8rem;font-weight:600;">Motif</label>
                  <select class="form-select" id="reason" name="reason">
                    <option value="">-- Sélectionner un motif --</option>
                    <option value="Commande reçue">Commande reçue</option>
                    <option value="Correction">Correction d'inventaire</option>
                    <option value="Don reçu">Don reçu</option>
                    <option value="Autre">Autre</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label" style="font-size:.8rem;font-weight:600;">Notes</label>
                  <textarea class="form-control" id="notes" name="notes" rows="2" placeholder="Notes supplémentaires…"></textarea>
                </div>
                <div class="d-flex justify-content-between gap-2">
                  <div class="d-flex gap-2">
                    <a href="list.html" class="btn btn-outline-secondary btn-sm">Annuler</a>
                    <a href="entry.html" class="btn btn-outline-info btn-sm"><i class="fas fa-exchange-alt me-1"></i>Changer</a>
                  </div>
                  <button type="submit" class="btn btn-primary btn-sm">
                    <i class="fas fa-sign-in-alt me-1"></i>Confirmer l'entrée
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

      </div>
    </div><!-- /.content -->
  </div><!-- /.main-content -->
</div><!-- /.app-layout -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script>
  const notify = new NotificationSystem({ position: 'top-right', duration: 5000 });
  const API_BASE = '/api';
  let supplyId = null;
  let currentSupply = null;
  let allSupplies = [];

  function getSupplyId() {
    return new URLSearchParams(window.location.search).get('id');
  }

  async function init() {
    const token = localStorage.getItem('jwt');
    if (!token) { window.location.href = '/index.html'; return; }
    supplyId = getSupplyId();
    if (!supplyId) {
      document.getElementById('selectSupplyContainer').classList.remove('hidden-section');
      await loadSuppliesList();
    } else {
      document.getElementById('productDetailsContainer').classList.remove('hidden-section');
      document.getElementById('formContainer').classList.remove('hidden-section');
      document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
      await loadSupplyDetails();
      setupFormHandlers();
    }
    updateUserMenu();
  }

  async function loadSuppliesList() {
    try {
      const token = localStorage.getItem('jwt');
      let page = 1, totalPages = 1;
      do {
        const res = await fetch(`${API_BASE}/supplies/list.php?limit=100&page=${page}`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error('Impossible de charger les fournitures');
        const data = await res.json();
        totalPages = data.pagination.pages;
        allSupplies = allSupplies.concat(data.data);
        page++;
      } while (page <= totalPages);
      renderSuppliesList(allSupplies);
    } catch (e) { notify.error('Erreur', e.message); }
  }

  function renderSuppliesList(supplies) {
    const list = document.getElementById('supplyList');
    list.innerHTML = '';
    if (supplies.length === 0) { list.innerHTML = '<div class="p-3 text-muted" style="font-size:.85rem;">Aucune fourniture trouvée</div>'; return; }
    supplies.forEach(s => {
      const item = document.createElement('div');
      item.className = 'supply-list-item';
      item.textContent = `${s.reference} — ${s.designation} (Stock: ${s.quantite_stock})`;
      item.addEventListener('click', () => selectSupply(s.id));
      list.appendChild(item);
    });
  }

  function filterSupplies() {
    const q = document.getElementById('supplySearch').value.toLowerCase();
    renderSuppliesList(allSupplies.filter(s => s.reference.toLowerCase().includes(q) || s.designation.toLowerCase().includes(q)));
  }

  function selectSupply(id) { document.getElementById('supplySelect').value = id; onSupplyChange(); }

  async function onSupplyChange() {
    const selectId = document.getElementById('supplySelect').value;
    if (!selectId) return;
    supplyId = selectId;
    document.getElementById('selectSupplyContainer').classList.add('hidden-section');
    document.getElementById('productDetailsContainer').classList.remove('hidden-section');
    document.getElementById('formContainer').classList.remove('hidden-section');
    document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
    await loadSupplyDetails();
    setupFormHandlers();
    window.scrollTo(0, 0);
  }

  async function loadSupplyDetails() {
    try {
      const token = localStorage.getItem('jwt');
      const res = await fetch(`${API_BASE}/supplies/show.php?id=${supplyId}`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) throw new Error('Impossible de charger les détails');
      const data = await res.json();
      currentSupply = data.data;
      document.getElementById('supplyName').textContent  = currentSupply.designation || 'N/A';
      document.getElementById('supplyRef').textContent   = currentSupply.reference   || 'N/A';
      document.getElementById('supplyStock').textContent = currentSupply.quantite_stock || '0';
      document.getElementById('supplyAlert').textContent = currentSupply.seuil_alerte  || '0';
      if (currentSupply.commande_en_cours) document.getElementById('reason').value = 'Commande reçue';
    } catch (e) { notify.error('Erreur', e.message); }
  }

  function setupFormHandlers() {
    document.getElementById('entryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const quantity  = parseInt(document.getElementById('quantity').value);
      const entryDate = document.getElementById('entryDate').value;
      const reason    = document.getElementById('reason').value;
      const notes     = document.getElementById('notes').value;
      if (quantity <= 0) { notify.error('Erreur', 'Quantité invalide'); return; }
      if (!entryDate)    { notify.error('Erreur', 'Veuillez sélectionner une date'); return; }
      await submitEntry(quantity, entryDate, reason, notes);
    });
  }

  async function submitEntry(quantity, entryDate, reason, notes) {
    try {
      const token = localStorage.getItem('jwt');
      let motif = reason || '';
      if (notes) motif += (motif ? ' - ' : '') + notes;
      const res = await fetch(`${API_BASE}/supplies/mouvement.php?id=${supplyId}`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'ENTREE', quantite: quantity, motif: motif || null, date_mouvement: entryDate }),
      });
      if (!res.ok) { const err = await res.json(); throw new Error(err.error || "Erreur d'enregistrement"); }
      notify.success('Succès', 'Entrée enregistrée !');
      document.getElementById('entryForm').reset();
      document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('quantity').value = 1;
      await loadSupplyDetails();
    } catch (e) { notify.error('Erreur', e.message); }
  }

  function incrementQuantity() { const i = document.getElementById('quantity'); i.value = (parseInt(i.value)||0) + 1; }
  function decrementQuantity() { const i = document.getElementById('quantity'); if ((parseInt(i.value)||1) > 1) i.value = parseInt(i.value) - 1; }

  async function updateUserMenu() {
    const token = localStorage.getItem('jwt');
    if (!token) return;
    const cached = JSON.parse(localStorage.getItem('user') || '{}');
    if (cached.prenom) {
      Sidebar.setUser(cached);
    }
    try {
      const res  = await fetch(`${API_BASE}/user/me.php`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (res.ok) {
        const data = await res.json();
        const u = data.user;
        Sidebar.setUser(u);
      }
    } catch(e) {}
  }

  init();
</script>
<script>
  let barcodeScanned = false, quaggaInitialized = false, scannerActive = false;

  function startScannerMode() {
    document.getElementById('scannerSection').style.display = 'block';
    document.getElementById('startScannerBtn').style.display = 'none';
    document.getElementById('supplySelect').disabled = true;
    scannerActive = true;
    initializeBarcodeScanner();
  }

  function stopScanner() {
    if (quaggaInitialized) { try { Quagga.stop(); } catch(e) {} }
    document.getElementById('scannerSection').style.display = 'none';
    document.getElementById('startScannerBtn').style.display = 'block';
    document.getElementById('supplySelect').disabled = false;
    scannerActive = false; barcodeScanned = false; quaggaInitialized = false;
  }

  function initializeBarcodeScanner() {
    const container  = document.getElementById('barcode-scanner');
    const resultNode = document.getElementById('scan-result');
    if (!container || !scannerActive) return;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        stream.getTracks().forEach(t => t.stop());
        if (typeof Quagga === 'undefined') { resultNode.innerHTML = '<div class="alert alert-danger">Quagga non disponible</div>'; return; }
        Quagga.init({
          inputStream: { name:'Live', type:'LiveStream', target:container, constraints:{ facingMode:'environment', width:{min:640}, height:{min:480} } },
          locator: { patchSize:'medium', halfSample:true },
          numOfWorkers: navigator.hardwareConcurrency || 4,
          decoder: { readers:['code_128_reader','ean_reader','ean_8_reader','code_39_reader','upc_reader','upc_e_reader'] },
          locate: true,
        }, err => {
          if (err) { resultNode.innerHTML = `<div class="alert alert-danger">${err.message}</div>`; return; }
          quaggaInitialized = true;
          Quagga.start();
          resultNode.innerHTML = '<div class="alert alert-info">Scanner prêt – scannez un code-barres</div>';
        });
      })
      .catch(err => { resultNode.innerHTML = `<div class="alert alert-danger">Erreur caméra: ${err.message}</div>`; });
    Quagga.onDetected(async data => {
      if (barcodeScanned) return;
      const code = data.codeResult.code;
      barcodeScanned = true;
      Quagga.stop();
      resultNode.innerHTML = '<div class="alert alert-info">Recherche du produit…</div>';
      try {
        const token = localStorage.getItem('jwt');
        const res   = await fetch(`${API_BASE}/supplies/list.php`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error('Erreur chargement');
        const listData   = await res.json();
        const foundSupply = (listData.data || []).find(s => s.reference === code || s.designation.includes(code));
        if (foundSupply) { resultNode.innerHTML = `<div class="alert alert-success">Produit trouvé: ${foundSupply.designation}</div>`; setTimeout(() => { window.location.href = `entry.html?id=${foundSupply.id}`; }, 500); }
        else { resultNode.innerHTML = `<div class="alert alert-warning">Code <strong>${code}</strong> non trouvé. Réessayez.</div>`; barcodeScanned = false; Quagga.start(); }
      } catch(e) { resultNode.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; barcodeScanned = false; Quagga.start(); }
    });
  }
</script>
</body>
</html>
