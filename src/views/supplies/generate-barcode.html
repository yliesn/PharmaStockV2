<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Générer Codes-barres - PharmaStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    .supply-item {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .supply-item:hover  { border-color: var(--primary); background: #f0fdf4; }
    .supply-item.checked { border-color: var(--primary); background: #d1fae5; }
    .supply-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
    .supply-ref { font-weight: 600; color: #1e293b; }
    .supply-designation { font-size: 0.88rem; color: #64748b; margin-top: 2px; }
    .selected-count {
      display: inline-flex;
      align-items: center;
      background: var(--primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .generate-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      text-align: center;
      position: sticky;
      top: 80px;
    }
    .generate-panel h6 { color: var(--primary); font-weight: 700; margin-bottom: .75rem; }
    .btn-generate-pdf {
      background: linear-gradient(135deg, var(--primary) 0%, #047857 100%);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all .2s;
      width: 100%;
    }
    .btn-generate-pdf:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    .btn-generate-pdf:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>
  <script src="../../assets/js/sidebar.js"></script>

  <!-- Contenu principal -->
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">Générer Codes-barres</h1>
      </div>
    </div>
    <div class="content">

      <div id="alert" class="alert alert-danger d-none mb-3"></div>

      <!-- En-tête -->
      <div class="d-flex align-items-center justify-content-between gap-3 mb-4">
        <div>
          <h4 class="fw-bold mb-0">Générer Codes-barres</h4>
          <p class="text-muted mb-0 small">Sélectionnez les fournitures et générez un PDF avec tous les codes-barres</p>
        </div>
        <div class="d-flex gap-2">
          <span class="selected-count">Sélectionnés : <span id="selectedCount" class="ms-1">0</span></span>
        </div>
      </div>

      <!-- Actions de sélection -->
      <div class="filter-bar mb-4 d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" onclick="selectAll()">Tout sélectionner</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="deselectAll()">Tout désélectionner</button>
      </div>

      <div class="row g-4">

        <!-- Liste des fournitures -->
        <div class="col-lg-8">
          <div id="suppliesList">
            <div class="text-center py-5">
              <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Chargement…</span>
              </div>
              <p class="mt-3 text-muted">Chargement des fournitures…</p>
            </div>
          </div>
        </div>

        <!-- Panneau de génération -->
        <div class="col-lg-4">
          <div class="generate-panel">
            <h6><i class="fas fa-file-pdf me-2"></i>Générer le PDF</h6>
            <p class="text-muted small mb-3">Créez un PDF avec les codes-barres des fournitures sélectionnées</p>
            <button class="btn-generate-pdf" id="generateBtn" onclick="generateBarcodePage()" disabled>
              <i class="fas fa-download me-2"></i>Générer PDF
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script>
  const API = '../../api';
  const notify = new NotificationSystem({ position: 'top-right', duration: 3000 });
  let supplies = [];

  if (!localStorage.getItem('jwt')) {
    window.location = '/index.html';
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadSupplies();
  });

  async function loadSupplies() {
    try {
      const url = new URL(`${API}/supplies/list.php`, window.location.origin);
      url.searchParams.append('limit', 1000);

      const res = await fetch(url, {
        headers: { 'Authorization': `Bearer ${localStorage.getItem('jwt')}` },
      });

      if (res.status === 401) {
        localStorage.removeItem('jwt');
        window.location = '/index.html';
        return;
      }

      const data = await res.json();

      if (!res.ok) {
        notify.error('Erreur', data.error || 'Erreur lors du chargement');
        return;
      }

      supplies = data.data || [];
      displaySupplies();
    } catch (e) {
      notify.error('Erreur', 'Impossible de contacter le serveur');
      console.error(e);
    }
  }

  function displaySupplies() {
    const container = document.getElementById('suppliesList');

    if (supplies.length === 0) {
      container.innerHTML = '<p class="text-muted text-center py-5">Aucune fourniture trouvée</p>';
      return;
    }

    container.innerHTML = supplies.map(supply => `
      <div class="supply-item" id="supply-${supply.id}" onclick="toggleCheckbox(${supply.id})">
        <input type="checkbox" class="supply-checkbox" data-id="${supply.id}" onchange="updateSelectedCount()">
        <div>
          <div class="supply-ref">${escapeHtml(supply.reference)}</div>
          <div class="supply-designation">${escapeHtml(supply.designation)}</div>
        </div>
      </div>
    `).join('');
  }

  function toggleCheckbox(id) {
    const checkbox = document.querySelector(`input[data-id="${id}"]`);
    checkbox.checked = !checkbox.checked;
    updateSelectedCount();
  }

  function updateSelectedCount() {
    const checked = document.querySelectorAll('.supply-checkbox:checked').length;
    document.getElementById('selectedCount').textContent = checked;

    document.querySelectorAll('.supply-item').forEach(item => {
      const cb = item.querySelector('.supply-checkbox');
      item.classList.toggle('checked', cb.checked);
    });

    document.getElementById('generateBtn').disabled = checked === 0;
  }

  function selectAll() {
    document.querySelectorAll('.supply-checkbox').forEach(cb => cb.checked = true);
    updateSelectedCount();
  }

  function deselectAll() {
    document.querySelectorAll('.supply-checkbox').forEach(cb => cb.checked = false);
    updateSelectedCount();
  }

  function generateBarcodePage() {
    const checked = document.querySelectorAll('.supply-checkbox:checked');

    if (checked.length === 0) {
      notify.error('Erreur', 'Sélectionnez au moins une fourniture');
      return;
    }

    const selectedSupplies = Array.from(checked).map(cb => supplies.find(s => s.id == cb.dataset.id));

    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = generatePDFContent(selectedSupplies);
    document.body.appendChild(tempDiv);

    const barcodes = tempDiv.querySelectorAll('[data-barcode]');
    barcodes.forEach((svg, index) => {
      try {
        JsBarcode(svg, svg.getAttribute('data-barcode'), {
          format: 'CODE128',
          width: 2,
          height: 40,
          displayValue: true,
          fontSize: 12,
          text: selectedSupplies[index].designation
        });
      } catch(e) {
        console.error('Erreur code-barre:', e);
      }
    });

    setTimeout(() => {
      const element = tempDiv.querySelector('.pdf-content');
      const opt = {
        margin: 10,
        filename: `codes-barres-${new Date().toISOString().split('T')[0]}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
      };

      html2pdf().set(opt).from(element).save();
      document.body.removeChild(tempDiv);
      notify.success('Succès', 'PDF généré et téléchargé');
    }, 500);
  }

  function generatePDFContent(suppliesList) {
    const currentDate = new Date().toLocaleDateString('fr-FR');
    const barcodeRows = suppliesList.map(supply =>
      `<div class="barcode-item"><svg data-barcode="${escapeHtml(supply.reference)}"></svg></div>`
    ).join('');

    return `
      <div class="pdf-content" style="background:white;padding:20px;">
        <div style="text-align:center;margin-bottom:30px;padding-bottom:20px;border-bottom:2px solid #333;">
          <h1 style="font-size:24px;color:#333;margin-bottom:8px;">Codes-barres PharmaStock</h1>
          <p style="color:#666;font-size:13px;">Généré le ${currentDate} — ${suppliesList.length} fourniture(s)</p>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;">
          ${barcodeRows}
        </div>
        <div style="text-align:center;color:#999;font-size:11px;margin-top:30px;padding-top:20px;border-top:1px solid #ddd;">
          PharmaStock — Système de gestion d'inventaire pharmacien
        </div>
      </div>
      <style>
        .barcode-item { background:white;padding:16px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:center;page-break-inside:avoid;break-inside:avoid; }
        .barcode-item svg { max-width:100%;height:auto; }
      </style>`;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>
</body>
</html>
