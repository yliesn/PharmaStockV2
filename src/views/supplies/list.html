<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock - PharmaStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar"></aside>
  <script src="../../assets/js/sidebar.js"></script>

  <!-- MAIN -->
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">Gestion des fournitures</h1>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" onclick="openCreateModal()">
          <i class="fas fa-plus me-1"></i>Ajouter
        </button>
      </div>
    </div>

    <div class="content">

      <div id="alert" class="alert alert-danger d-none mb-3"></div>

      <!-- Recherche + filtres -->
      <div class="filter-bar mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-5">
            <label class="form-label" style="font-size:.75rem;font-weight:600;margin-bottom:.25rem;">Recherche</label>
            <div class="input-group input-group-sm">
              <span class="input-group-text"><i class="fas fa-search" style="font-size:.75rem;color:#94a3b8;"></i></span>
              <input type="text" id="searchInput" class="form-control" placeholder="Référence ou désignation…">
              <button class="btn btn-outline-secondary" type="button" onclick="loadSupplies(1)">Rechercher</button>
            </div>
          </div>
          <div class="col-12 col-md-7">
            <label class="form-label" style="font-size:.75rem;font-weight:600;margin-bottom:.25rem;">Filtres rapides</label>
            <div class="d-flex gap-3 flex-wrap align-items-center">
              <div class="form-check form-check-inline mb-0">
                <input class="form-check-input" type="checkbox" id="filterStockNormal" onchange="loadSupplies(1)">
                <label class="form-check-label" for="filterStockNormal" style="font-size:.8rem;">Stock OK</label>
              </div>
              <div class="form-check form-check-inline mb-0">
                <input class="form-check-input" type="checkbox" id="filterStockBas" onchange="loadSupplies(1)">
                <label class="form-check-label" for="filterStockBas" style="font-size:.8rem;">Stock bas</label>
              </div>
              <div class="form-check form-check-inline mb-0">
                <input class="form-check-input" type="checkbox" id="filterRupture" onchange="loadSupplies(1)">
                <label class="form-check-label" for="filterRupture" style="font-size:.8rem;">Rupture</label>
              </div>
              <div class="form-check form-check-inline mb-0">
                <input class="form-check-input" type="checkbox" id="filterCommande" onchange="loadSupplies(1)">
                <label class="form-check-label" for="filterCommande" style="font-size:.8rem;">En commande</label>
              </div>
              <select id="statutSelect" class="form-select form-select-sm" style="width:auto;" onchange="loadSupplies(1)" title="Statut">
                <option value="actifs" selected>Actives</option>
                <option value="inactifs">Inactives</option>
                <option value="tous">Toutes</option>
              </select>
              <button class="btn btn-outline-secondary btn-sm" onclick="clearFilters()">
                <i class="fas fa-times me-1"></i>Réinitialiser
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Tableau -->
      <div class="table-wrapper">
        <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
          <span style="font-size:.75rem;color:var(--text-2);">
            Total: <strong id="totalSupplies">0</strong> fournitures
          </span>
          <select id="limitSelect" class="form-select form-select-sm d-inline-block" style="width:110px;" onchange="saveLimitToStorage(this.value); loadSupplies(1)">
            <option value="10" selected>10 / page</option>
            <option value="15">15 / page</option>
            <option value="20">20 / page</option>
            <option value="50">50 / page</option>
            <option value="100">100 / page</option>
          </select>
        </div>
        <div class="table-responsive">
          <table class="table mb-0">
            <thead>
              <tr>
                <th style="width:15%;">Référence</th>
                <th style="width:35%;">Désignation</th>
                <th style="width:12%;text-align:center;">Stock</th>
                <th style="width:12%;text-align:center;">Alerte</th>
                <th style="width:15%;text-align:center;">Commande</th>
                <th style="width:11%;text-align:center;">Actions</th>
              </tr>
            </thead>
            <tbody id="suppliesTableBody">
              <tr><td colspan="6" class="text-center text-muted py-4">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Pagination -->
      <div class="d-flex justify-content-between align-items-center mt-3">
        <nav><ul class="pagination pagination-sm mb-0" id="paginationNav"></ul></nav>
      </div>

    </div><!-- /.content -->
  </div><!-- /.main-content -->
</div><!-- /.app-layout -->

<!-- Modal Créer Fourniture -->
<div class="modal fade" id="createModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Ajouter une fourniture</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="supplyForm">
          <div class="mb-3">
            <label class="form-label" style="font-size:.8rem;font-weight:600;">Désignation <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="designation" required>
          </div>
          <div class="mb-3">
            <label class="form-label" style="font-size:.8rem;font-weight:600;">Conditionnement</label>
            <input type="text" class="form-control" id="conditionnement" placeholder="ex: Boîte x 20">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label" style="font-size:.8rem;font-weight:600;">Quantité</label>
              <input type="number" class="form-control" id="quantite_stock" value="0" min="0">
            </div>
            <div class="col-md-6">
              <label class="form-label" style="font-size:.8rem;font-weight:600;">Seuil alerte</label>
              <input type="number" class="form-control" id="seuil_alerte" min="0">
            </div>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="commande_en_cours">
            <label class="form-check-label" for="commande_en_cours" style="font-size:.85rem;">Commande en cours</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-primary btn-sm" id="submitBtn" onclick="submitSupplyForm()">Créer</button>
      </div>
    </div>
  </div>
</div>

<script src="../../assets/js/notifications.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API = '../../api';
  const notify = new NotificationSystem({ position: 'top-right', duration: 4000 });
  let currentPage = 1, currentSearch = '', currentSupplyId = null, allSupplies = [], allPagination = {};

  if (!localStorage.getItem('jwt')) window.location = '/index.html';

  document.addEventListener('DOMContentLoaded', () => {
    loadUserMenu();
    loadLimitFromStorage();
    loadSupplies(1);
    setupEventListeners();
  });

  function loadUserMenu() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.prenom) {
      Sidebar.setUser(user);
    }
  }

  function setupEventListeners() {
    document.getElementById('searchInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') { currentSearch = document.getElementById('searchInput').value; loadSupplies(1); }
    });
  }

  function loadLimitFromStorage() {
    const saved = localStorage.getItem('suppliesLimit');
    if (saved) document.getElementById('limitSelect').value = saved;
  }

  function saveLimitToStorage(limit) { localStorage.setItem('suppliesLimit', limit); }

  async function loadSupplies(page) {
    currentPage = page;
    const limit  = document.getElementById('limitSelect').value;
    const search = document.getElementById('searchInput').value;
    const hasFiltersChanged = document.getElementById('filterStockNormal').checked ||
      document.getElementById('filterStockBas').checked ||
      document.getElementById('filterRupture').checked ||
      document.getElementById('filterCommande').checked ||
      search !== currentSearch;
    if (page !== 1 && !hasFiltersChanged && allSupplies.length > 0) {
      renderSuppliesTable(applyFilters(allSupplies));
      renderFilteredPagination(applyFilters(allSupplies), parseInt(limit));
      return;
    }
    currentSearch = search;
    const url = new URL(`${API}/supplies/list.php`, window.location.origin);
    url.searchParams.append('page', 1);
    url.searchParams.append('limit', 100);
    if (search) url.searchParams.append('search', search);
    url.searchParams.append('statut', document.getElementById('statutSelect').value);
    try {
      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${localStorage.getItem('jwt')}` } });
      if (res.status === 401) { localStorage.removeItem('jwt'); window.location = '/index.html'; return; }
      const data = await res.json();
      if (!res.ok) { notify.error('Erreur', data.error || 'Erreur lors du chargement'); return; }
      allSupplies = data.data;
      allPagination = data.pagination;
      currentPage = 1;
      document.getElementById('totalSupplies').textContent = data.pagination.total;
      const filtered = applyFilters(allSupplies);
      renderSuppliesTable(filtered);
      renderFilteredPagination(filtered, parseInt(limit));
    } catch(e) { notify.error('Erreur', 'Impossible de contacter le serveur'); }
  }

  function applyFilters(supplies) {
    const fN = document.getElementById('filterStockNormal').checked;
    const fB = document.getElementById('filterStockBas').checked;
    const fR = document.getElementById('filterRupture').checked;
    const fC = document.getElementById('filterCommande').checked;
    if (!fN && !fB && !fR && !fC) return supplies;
    return supplies.filter(s => {
      if (fN && s.quantite_stock > 0 && (!s.seuil_alerte || s.quantite_stock > s.seuil_alerte)) return true;
      if (fB && s.quantite_stock > 0 && s.seuil_alerte && s.quantite_stock <= s.seuil_alerte) return true;
      if (fR && s.quantite_stock === 0) return true;
      if (fC && s.commande_en_cours) return true;
      return false;
    });
  }

  function renderFilteredPagination(filtered, limit) {
    const nav = document.getElementById('paginationNav');
    const totalPages = Math.ceil(filtered.length / limit);
    if (totalPages <= 1) { nav.innerHTML = ''; return; }
    let html = '';
    if (currentPage > 1) html += `<li class="page-item"><a class="page-link" href="javascript:loadSupplies(${currentPage-1})">‹</a></li>`;
    for (let i = 1; i <= totalPages; i++) {
      html += `<li class="page-item ${i===currentPage?'active':''}"><a class="page-link" href="javascript:loadSupplies(${i})">${i}</a></li>`;
    }
    if (currentPage < totalPages) html += `<li class="page-item"><a class="page-link" href="javascript:loadSupplies(${currentPage+1})">›</a></li>`;
    nav.innerHTML = html;
  }

  function renderSuppliesTable(allS) {
    const limit  = parseInt(document.getElementById('limitSelect').value);
    const offset = (currentPage - 1) * limit;
    const supplies = allS.slice(offset, offset + limit);
    const tbody = document.getElementById('suppliesTableBody');
    if (supplies.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Aucune fourniture trouvée</td></tr>';
      return;
    }
    tbody.innerHTML = supplies.map(s => {
      let stockBadge;
      if (s.quantite_stock === 0)
        stockBadge = `<span class="badge bg-danger">${s.quantite_stock}</span>`;
      else if (s.seuil_alerte && s.quantite_stock <= s.seuil_alerte)
        stockBadge = `<span class="badge bg-warning">${s.quantite_stock}</span>`;
      else
        stockBadge = `<span class="badge bg-success">${s.quantite_stock}</span>`;
      const inactif = !s.actif;
      const mvtButtons = inactif ? '' : `
              <a href="entry.html?id=${s.id}" class="btn btn-outline-success" title="Entrée"><i class="fas fa-arrow-circle-down fa-sm"></i></a>
              <a href="exit.html?id=${s.id}" class="btn btn-outline-danger" title="Sortie"><i class="fas fa-arrow-circle-up fa-sm"></i></a>
              <button class="btn btn-outline-warning" onclick="toggleOrder(${s.id}, ${s.commande_en_cours ? 'false' : 'true'})" title="${s.commande_en_cours ? 'Annuler commande' : 'Mettre en commande'}">
                <i class="fas fa-truck fa-sm"></i>
              </button>`;
      return `
        <tr${inactif ? ' class="text-muted" style="opacity:.6;"' : ''}>
          <td><strong style="font-size:.85rem;">${escapeHtml(s.reference)}</strong>${inactif ? ' <span class="badge bg-secondary">Inactive</span>' : ''}</td>
          <td>
            <div style="font-size:.85rem;">${escapeHtml(s.designation)}</div>
            ${s.conditionnement ? `<div style="font-size:.75rem;color:var(--text-3);">${escapeHtml(s.conditionnement)}</div>` : ''}
          </td>
          <td class="text-center">${stockBadge}</td>
          <td class="text-center">${s.seuil_alerte ? `<span class="badge bg-warning">${s.seuil_alerte}</span>` : '—'}</td>
          <td class="text-center">${s.commande_en_cours ? '<span class="badge bg-info">Oui</span>' : '<span class="badge bg-secondary">Non</span>'}</td>
          <td class="text-center">
            <div class="btn-group btn-group-sm">
              <a href="view.html?id=${s.id}" class="btn btn-outline-primary" title="Voir"><i class="fas fa-eye fa-sm"></i></a>${mvtButtons}
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  function openCreateModal() {
    document.getElementById('supplyForm').reset();
    new bootstrap.Modal(document.getElementById('createModal')).show();
  }

  async function submitSupplyForm() {
    const designation     = document.getElementById('designation').value.trim();
    const conditionnement = document.getElementById('conditionnement').value.trim();
    const quantite_stock  = parseInt(document.getElementById('quantite_stock').value) || 0;
    const seuil_alerte    = parseInt(document.getElementById('seuil_alerte').value) || 0;
    const commande_en_cours = document.getElementById('commande_en_cours').checked;
    if (!designation) { notify.error('Erreur', 'Veuillez remplir la désignation'); return; }
    try {
      const res = await fetch('/api/supplies/create.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('jwt') },
        body: JSON.stringify({ designation, conditionnement, quantite_stock, seuil_alerte, commande_en_cours }),
      });
      const result = await res.json();
      if (res.ok) {
        notify.success('Succès', `Fourniture créée: ${result.data.reference}`);
        bootstrap.Modal.getInstance(document.getElementById('createModal')).hide();
        loadSupplies(1);
      } else { notify.error('Erreur', result.error || 'Erreur lors de la création'); }
    } catch(e) { notify.error('Erreur', e.message); }
  }

  function clearFilters() {
    ['filterStockNormal','filterStockBas','filterRupture','filterCommande'].forEach(id => document.getElementById(id).checked = false);
    document.getElementById('searchInput').value = '';
    document.getElementById('statutSelect').value = 'actifs';
    loadSupplies(1);
  }

  async function toggleOrder(supplyId, shouldOrder) {
    try {
      const url = new URL(`${API}/supplies/update.php`, window.location.origin);
      url.searchParams.append('id', supplyId);
      const res = await fetch(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('jwt') },
        body: JSON.stringify({ commande_en_cours: shouldOrder }),
      });
      const result = await res.json();
      if (res.ok) { notify.success('Succès', shouldOrder ? 'Mis en commande' : 'Commande annulée'); loadSupplies(currentPage); }
      else { notify.error('Erreur', result.error || 'Erreur lors de la mise à jour'); }
    } catch(e) { notify.error('Erreur', e.message); }
  }

  function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
</script>
</body>
</html>
