<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historique des mouvements - PharmaStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <style>
    .type-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .type-entree { background: #d1fae5; color: #065f46; }
    .type-sortie { background: #fee2e2; color: #991b1b; }
    .stat-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .stat-pill strong { display: block; font-size: 1.2rem; }
    .fourniture-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .fourniture-link:hover { text-decoration: underline; }
    .empty-state {
      padding: 3rem 1rem;
      text-align: center;
      color: #6c757d;
    }
    .empty-state i {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      opacity: .4;
      display: block;
    }
  </style>
</head>
<body>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>
  <script src="../../assets/js/sidebar.js"></script>

  <!-- Contenu principal -->
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">Historique des mouvements</h1>
      </div>
    </div>
    <div class="content">

      <!-- En-tête -->
      <div class="d-flex align-items-center gap-3 mb-4">
        <div>
          <h4 class="fw-bold mb-0">Historique des mouvements</h4>
          <p class="text-muted mb-0 small">Toutes les entrées et sorties de stock</p>
        </div>
      </div>

      <!-- Stats rapides -->
      <div class="d-flex flex-wrap gap-3 mb-4" id="stats-row">
        <div class="stat-pill">
          <strong id="stat-total">—</strong>
          mouvements au total
        </div>
        <div class="stat-pill">
          <strong class="text-success" id="stat-entrees">—</strong>
          entrées
        </div>
        <div class="stat-pill">
          <strong class="text-danger" id="stat-sorties">—</strong>
          sorties
        </div>
        <div class="stat-pill">
          <strong style="color:var(--primary)" id="stat-qte-entree">—</strong>
          unités reçues
        </div>
        <div class="stat-pill">
          <strong class="text-danger" id="stat-qte-sortie">—</strong>
          unités sorties
        </div>
      </div>

      <!-- Filtres -->
      <div class="filter-bar mb-4">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-3">
            <label class="form-label small fw-semibold mb-1">Recherche</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fas fa-search text-muted" style="font-size:.8rem"></i></span>
              <input type="text" id="searchInput" class="form-control" placeholder="Produit, référence, utilisateur…">
            </div>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold mb-1">Type</label>
            <select id="typeSelect" class="form-select">
              <option value="">Tous</option>
              <option value="ENTREE">Entrées</option>
              <option value="SORTIE">Sorties</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold mb-1">Du</label>
            <input type="date" id="dateDebut" class="form-control">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold mb-1">Au</label>
            <input type="date" id="dateFin" class="form-control">
          </div>
          <div class="col-6 col-md-1">
            <label class="form-label small fw-semibold mb-1">Lignes</label>
            <select id="limitSelect" class="form-select">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
          <div class="col-12 col-md-2 d-flex gap-2">
            <button class="btn btn-primary w-100" onclick="load(1)">
              <i class="fas fa-filter"></i> Filtrer
            </button>
            <button class="btn btn-outline-secondary" onclick="resetFilters()" title="Réinitialiser">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Tableau -->
      <div class="table-wrapper">
        <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
          <span class="text-muted small" id="result-info">—</span>
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th style="width:110px">Date</th>
                <th style="width:90px; text-align:center">Type</th>
                <th>Fourniture</th>
                <th style="width:80px; text-align:center">Quantité</th>
                <th>Motif</th>
                <th style="width:140px">Utilisateur</th>
                <th style="width:60px; text-align:center">Action</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="7" class="text-center text-muted py-4">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Pagination -->
      <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
        <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
        <span class="text-muted small" id="page-info"></span>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API   = '/api';
const token = localStorage.getItem('jwt');
if (!token) window.location = '/index.html';

// ── Init : pré-rempli depuis l'URL si fourniture passée en param ──
(function() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('search')) document.getElementById('searchInput').value = p.get('search');
  if (p.get('type'))   document.getElementById('typeSelect').value  = p.get('type');
})();

// ── Chargement ───────────────────────────────────────────────
async function load(page = 1) {
  const search    = document.getElementById('searchInput').value.trim();
  const type      = document.getElementById('typeSelect').value;
  const dateDebut = document.getElementById('dateDebut').value;
  const dateFin   = document.getElementById('dateFin').value;
  const limit     = document.getElementById('limitSelect').value;

  const url = new URL(`${API}/supplies/mouvements.php`, window.location.origin);
  url.searchParams.set('page',  page);
  url.searchParams.set('limit', limit);
  if (search)    url.searchParams.set('search',     search);
  if (type)      url.searchParams.set('type',        type);
  if (dateDebut) url.searchParams.set('date_debut',  dateDebut);
  if (dateFin)   url.searchParams.set('date_fin',    dateFin);

  setLoading(true);

  try {
    const res  = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.status === 401) { window.location = '/index.html'; return; }
    const data = await res.json();
    if (!res.ok) { showError(data.error); return; }

    renderTable(data.data);
    renderPagination(data.pagination);
    updateResultInfo(data.pagination);
    updateStats(data.data, data.pagination.total);

  } catch(e) {
    showError('Impossible de contacter le serveur.');
    console.error(e);
  } finally {
    setLoading(false);
  }
}

// ── Rendu tableau ────────────────────────────────────────────
function renderTable(rows) {
  const tbody = document.getElementById('tableBody');

  if (rows.length === 0) {
    tbody.innerHTML = `
      <tr><td colspan="7">
        <div class="empty-state">
          <i class="fas fa-box-open"></i>
          Aucun mouvement trouvé pour ces critères.
        </div>
      </td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(m => {
    const isE  = m.type === 'ENTREE';
    const pill = isE
      ? '<span class="type-pill type-entree"><i class="fas fa-arrow-down" style="font-size:.65rem"></i> Entrée</span>'
      : '<span class="type-pill type-sortie"><i class="fas fa-arrow-up"   style="font-size:.65rem"></i> Sortie</span>';
    const qteColor = isE ? 'text-success' : 'text-danger';
    const qteSign  = isE ? '+' : '−';
    const date     = new Date(m.date_mouvement).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'});

    return `
      <tr>
        <td class="text-muted small align-middle">${date}</td>
        <td class="align-middle text-center">${pill}</td>
        <td class="align-middle">
          <a href="view.html?id=${m.fourniture.id}" class="fourniture-link">${esc(m.fourniture.designation)}</a>
          <div class="text-muted small">${esc(m.fourniture.reference)}</div>
        </td>
        <td class="align-middle text-center fw-semibold ${qteColor}">${qteSign}${m.quantite}</td>
        <td class="align-middle text-muted small">${esc(m.motif || '—')}</td>
        <td class="align-middle small">${esc(m.utilisateur.prenom)} ${esc(m.utilisateur.nom)}</td>
        <td class="align-middle text-center">
          <a href="view.html?id=${m.fourniture.id}" class="btn btn-sm btn-outline-secondary py-0" title="Voir la fiche">
            <i class="fas fa-eye" style="font-size:.75rem"></i>
          </a>
        </td>
      </tr>`;
  }).join('');
}

// ── Stats (cumulées sur la page courante) ────────────────────
function updateStats(rows, total) {
  const entrees = rows.filter(r => r.type === 'ENTREE');
  const sorties = rows.filter(r => r.type === 'SORTIE');
  const qteE    = entrees.reduce((s, r) => s + r.quantite, 0);
  const qteS    = sorties.reduce((s, r) => s + r.quantite, 0);

  document.getElementById('stat-total').textContent    = total;
  document.getElementById('stat-entrees').textContent  = entrees.length;
  document.getElementById('stat-sorties').textContent  = sorties.length;
  document.getElementById('stat-qte-entree').textContent = '+' + qteE;
  document.getElementById('stat-qte-sortie').textContent = '−' + qteS;
}

// ── Pagination ───────────────────────────────────────────────
function renderPagination(p) {
  const nav = document.getElementById('pagination');
  if (p.pages <= 1) { nav.innerHTML = ''; return; }

  let html = '';
  if (p.page > 1)
    html += `<li class="page-item"><a class="page-link" href="javascript:load(${p.page - 1})">‹</a></li>`;

  const start = Math.max(1, p.page - 2);
  const end   = Math.min(p.pages, p.page + 2);
  if (start > 1) html += `<li class="page-item"><a class="page-link" href="javascript:load(1)">1</a></li>${start > 2 ? '<li class="page-item disabled"><span class="page-link">…</span></li>' : ''}`;

  for (let i = start; i <= end; i++) {
    html += `<li class="page-item ${i === p.page ? 'active' : ''}">
      <a class="page-link" href="javascript:load(${i})">${i}</a>
    </li>`;
  }

  if (end < p.pages) html += `${end < p.pages - 1 ? '<li class="page-item disabled"><span class="page-link">…</span></li>' : ''}<li class="page-item"><a class="page-link" href="javascript:load(${p.pages})">${p.pages}</a></li>`;

  if (p.page < p.pages)
    html += `<li class="page-item"><a class="page-link" href="javascript:load(${p.page + 1})">›</a></li>`;

  nav.innerHTML = html;
}

function updateResultInfo(p) {
  const from = (p.page - 1) * p.limit + 1;
  const to   = Math.min(p.page * p.limit, p.total);
  document.getElementById('result-info').textContent =
    p.total === 0 ? 'Aucun résultat' : `${from}–${to} sur ${p.total} mouvements`;
  document.getElementById('page-info').textContent =
    p.total > 0 ? `Page ${p.page} / ${p.pages}` : '';
}

// ── Utilitaires ──────────────────────────────────────────────
function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('typeSelect').value  = '';
  document.getElementById('dateDebut').value   = '';
  document.getElementById('dateFin').value     = '';
  load(1);
}

function setLoading(on) {
  if (on) document.getElementById('tableBody').innerHTML =
    '<tr><td colspan="7" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2"></span>Chargement…</td></tr>';
}

function showError(msg) {
  document.getElementById('tableBody').innerHTML =
    `<tr><td colspan="7" class="text-center text-danger py-4"><i class="fas fa-exclamation-triangle me-2"></i>${esc(msg)}</td></tr>`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') load(1);
});

load(1);
</script>
</body>
</html>
