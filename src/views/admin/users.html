<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utilisateurs - PharmaStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <style>
    .action-btn { padding: 3px 8px; font-size: .78rem; }
  </style>
</head>
<body>
<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar"></aside>
  <script src="../../assets/js/sidebar.js"></script>

  <!-- MAIN -->
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">Gestion des utilisateurs</h1>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" onclick="openCreateModal()">
          <i class="fas fa-plus me-1"></i>Nouvel utilisateur
        </button>
      </div>
    </div>

    <div class="content">

      <!-- Stat Cards -->
      <div class="stat-grid mb-4">
        <div class="stat-card">
          <div class="stat-icon stat-icon-green"><i class="fas fa-users"></i></div>
          <div class="stat-value" id="stat-total">—</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-red"><i class="fas fa-user-shield"></i></div>
          <div class="stat-value text-danger" id="stat-admins">—</div>
          <div class="stat-label">Admins</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-blue"><i class="fas fa-user"></i></div>
          <div class="stat-value" style="color:#2563EB" id="stat-users">—</div>
          <div class="stat-label">Utilisateurs</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:#F1F5F9;color:#64748b;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-user-slash"></i></div>
          <div class="stat-value text-muted" id="stat-inactifs">—</div>
          <div class="stat-label">Inactifs</div>
        </div>
      </div>

      <!-- Filtres -->
      <div class="filter-bar mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-4">
            <label class="form-label" style="font-size:.75rem;font-weight:600;margin-bottom:.25rem;">Recherche</label>
            <div class="input-group input-group-sm">
              <span class="input-group-text"><i class="fas fa-search" style="font-size:.75rem;color:#94a3b8"></i></span>
              <input type="text" id="searchInput" class="form-control" placeholder="Nom, prénom, login…">
            </div>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label" style="font-size:.75rem;font-weight:600;margin-bottom:.25rem;">Rôle</label>
            <select id="roleFilter" class="form-select form-select-sm">
              <option value="">Tous</option>
              <option value="ADMIN">Admin</option>
              <option value="UTILISATEUR">Utilisateur</option>
              <option value="VISITEUR">Visiteur</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label" style="font-size:.75rem;font-weight:600;margin-bottom:.25rem;">Statut</label>
            <select id="actifFilter" class="form-select form-select-sm">
              <option value="">Tous</option>
              <option value="true">Actifs</option>
              <option value="false">Inactifs</option>
            </select>
          </div>
          <div class="col-6 col-md-1">
            <label class="form-label" style="font-size:.75rem;font-weight:600;margin-bottom:.25rem;">Lignes</label>
            <select id="limitSelect" class="form-select form-select-sm">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
            </select>
          </div>
          <div class="col-6 col-md-3 d-flex gap-2">
            <button class="btn btn-primary btn-sm w-100" onclick="load(1)">
              <i class="fas fa-filter me-1"></i>Filtrer
            </button>
            <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()" title="Réinitialiser">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Tableau -->
      <div class="table-wrapper">
        <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
          <span style="font-size:.75rem;color:var(--text-2);" id="result-info">—</span>
        </div>
        <div class="table-responsive">
          <table class="table mb-0">
            <thead>
              <tr>
                <th style="width:40px"></th>
                <th>Nom / Prénom</th>
                <th>Login</th>
                <th style="width:120px">Rôle</th>
                <th style="width:90px;text-align:center">Statut</th>
                <th style="width:130px">Dernière co.</th>
                <th style="width:130px;text-align:center">Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="7" class="text-center text-muted py-4">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Pagination -->
      <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
        <nav><ul class="pagination mb-0 pagination-sm" id="pagination"></ul></nav>
        <span style="font-size:.75rem;color:var(--text-2);" id="page-info"></span>
      </div>

    </div><!-- /.content -->
  </div><!-- /.main-content -->
</div><!-- /.app-layout -->

<!-- MODAL CRÉER / MODIFIER -->
<div class="modal fade" id="userModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Nouvel utilisateur</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modal-alert" class="d-none mb-3"></div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" style="font-size:.8rem;font-weight:600;">Prénom <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="f-prenom" placeholder="ex: Jean">
          </div>
          <div class="col-md-6">
            <label class="form-label" style="font-size:.8rem;font-weight:600;">Nom <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="f-nom" placeholder="ex: Dupont">
          </div>
          <div class="col-md-6">
            <label class="form-label" style="font-size:.8rem;font-weight:600;">Login <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="f-login" placeholder="ex: jdupont" autocomplete="off">
          </div>
          <div class="col-md-6">
            <label class="form-label" style="font-size:.8rem;font-weight:600;">Rôle <span class="text-danger">*</span></label>
            <select class="form-select" id="f-role">
              <option value="UTILISATEUR">Utilisateur</option>
              <option value="ADMIN">Admin</option>
              <option value="VISITEUR">Visiteur</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" style="font-size:.8rem;font-weight:600;" id="pwd-label">
              Mot de passe <span class="text-danger">*</span>
            </label>
            <div class="input-group">
              <input type="password" class="form-control" id="f-password" placeholder="Min. 8 caractères" autocomplete="new-password" oninput="checkStrength(this.value)">
              <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('f-password', this)"><i class="fas fa-eye"></i></button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strength-fill" style="width:0%"></div></div>
            <div class="small mt-1" id="strength-label" style="color:#6c757d"></div>
            <div class="form-text" id="pwd-hint"></div>
          </div>
          <div class="col-md-6 d-flex align-items-end" id="actif-wrapper">
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" id="f-actif" checked>
              <label class="form-check-label" style="font-size:.85rem;font-weight:600;" for="f-actif">Compte actif</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
        <button class="btn btn-primary btn-sm" id="btn-submit" onclick="submitModal()">
          <span id="spinner-modal" class="spinner-border spinner-border-sm me-1 d-none"></span>
          <span id="btn-submit-label">Créer</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL SUPPRESSION -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title text-danger"><i class="fas fa-trash me-2"></i>Supprimer</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="font-size:.85rem;">
        Supprimer <strong id="delete-name"></strong> ? Cette action est irréversible.
      </div>
      <div class="modal-footer border-0 pt-0">
        <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
        <button class="btn btn-danger btn-sm" id="btn-confirm-delete">
          <span id="spinner-delete" class="spinner-border spinner-border-sm me-1 d-none"></span>
          Supprimer
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script>
const API   = '../../api';
const token = localStorage.getItem('jwt');
if (!token) window.location = '../../index.html';

const notify = new NotificationSystem({ position: 'top-right', duration: 4000 });

const cached = JSON.parse(localStorage.getItem('user') || '{}');
if (cached.prenom) {
  Sidebar.setUser(cached);
}

(async () => {
  try {
    const res  = await fetch(`${API}/user/me.php`, { headers: { 'Authorization': `Bearer ${token}` } });
    const data = await res.json();
    if (!res.ok || data.user.role !== 'ADMIN') { window.location = '../dashboard.html'; return; }
    Sidebar.setUser(data.user);
  } catch(e) { window.location = '../dashboard.html'; }
})();

let editingId  = null;
let deletingId = null;
let allUsers   = [];

async function load(page = 1) {
  const search = document.getElementById('searchInput').value.trim();
  const role   = document.getElementById('roleFilter').value;
  const actif  = document.getElementById('actifFilter').value;
  const limit  = document.getElementById('limitSelect').value;

  const url = new URL(`${API}/admin/users.php`, window.location.origin);
  url.searchParams.set('page', page);
  url.searchParams.set('limit', limit);
  if (search) url.searchParams.set('search', search);
  if (role)   url.searchParams.set('role',   role);
  if (actif)  url.searchParams.set('actif',  actif);

  setTableLoading();
  try {
    const res  = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.status === 401) { window.location = '../../index.html'; return; }
    if (res.status === 403) { window.location = '../dashboard.html'; return; }
    const data = await res.json();
    if (!res.ok) { showTableError(data.error); return; }
    allUsers = data.data;
    renderTable(data.data);
    renderPagination(data.pagination);
    updateResultInfo(data.pagination);
    updateStats(data.data, data.pagination.total);
  } catch(e) { showTableError('Impossible de contacter le serveur.'); }
}

function renderTable(users) {
  const tbody = document.getElementById('tableBody');
  const me    = JSON.parse(localStorage.getItem('user') || '{}');
  if (users.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><i class="fas fa-users"></i>Aucun utilisateur trouvé.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = users.map(u => {
    const initials = (u.prenom?.[0] ?? '') + (u.nom?.[0] ?? '');
    const isMe     = u.id === me.id;
    const lastCo   = u.date_derniere_connexion
      ? new Date(u.date_derniere_connexion).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' })
      : '—';
    const statusBadge = u.actif
      ? '<span class="badge bg-success">Actif</span>'
      : '<span class="badge bg-secondary">Inactif</span>';
    const toggleBtn = isMe ? '' : u.actif
      ? `<button class="btn btn-outline-warning action-btn" onclick="toggleStatus(${u.id}, false)" title="Désactiver"><i class="fas fa-ban"></i></button>`
      : `<button class="btn btn-outline-success action-btn" onclick="toggleStatus(${u.id}, true)" title="Activer"><i class="fas fa-check"></i></button>`;
    const deleteBtn = isMe ? '' :
      `<button class="btn btn-outline-danger action-btn" onclick="openDeleteModal(${u.id}, '${esc(u.prenom)} ${esc(u.nom)}')" title="Supprimer"><i class="fas fa-trash"></i></button>`;
    return `
      <tr>
        <td><div class="avatar-sm avatar-${u.role}">${initials.toUpperCase()}</div></td>
        <td>
          <div class="fw-semibold" style="font-size:.85rem;">
            ${esc(u.prenom)} ${esc(u.nom)}
            ${isMe ? '<span class="badge bg-secondary" style="font-size:.6rem;">moi</span>' : ''}
          </div>
        </td>
        <td><span class="font-monospace" style="font-size:.8rem;">${esc(u.login)}</span></td>
        <td><span class="role-badge role-${u.role}">${u.role}</span></td>
        <td class="text-center">${statusBadge}</td>
        <td style="font-size:.8rem;color:var(--text-2);">${lastCo}</td>
        <td class="text-center">
          <div class="d-flex gap-1 justify-content-center">
            <button class="btn btn-outline-primary action-btn" onclick="openEditModal(${u.id})" title="Modifier"><i class="fas fa-pen"></i></button>
            ${toggleBtn}
            ${deleteBtn}
          </div>
        </td>
      </tr>`;
  }).join('');
}

function updateStats(users, total) {
  document.getElementById('stat-total').textContent    = total;
  document.getElementById('stat-admins').textContent   = users.filter(u => u.role === 'ADMIN').length;
  document.getElementById('stat-users').textContent    = users.filter(u => u.role === 'UTILISATEUR').length;
  document.getElementById('stat-inactifs').textContent = users.filter(u => !u.actif).length;
}

function renderPagination(p) {
  const nav = document.getElementById('pagination');
  if (p.pages <= 1) { nav.innerHTML = ''; return; }
  let html = '';
  if (p.page > 1) html += `<li class="page-item"><a class="page-link" href="javascript:load(${p.page-1})">‹</a></li>`;
  const start = Math.max(1, p.page - 2);
  const end   = Math.min(p.pages, p.page + 2);
  if (start > 1) { html += `<li class="page-item"><a class="page-link" href="javascript:load(1)">1</a></li>`; if (start > 2) html += `<li class="page-item disabled"><span class="page-link">…</span></li>`; }
  for (let i = start; i <= end; i++) { html += `<li class="page-item ${i === p.page ? 'active' : ''}"><a class="page-link" href="javascript:load(${i})">${i}</a></li>`; }
  if (end < p.pages) { if (end < p.pages - 1) html += `<li class="page-item disabled"><span class="page-link">…</span></li>`; html += `<li class="page-item"><a class="page-link" href="javascript:load(${p.pages})">${p.pages}</a></li>`; }
  if (p.page < p.pages) html += `<li class="page-item"><a class="page-link" href="javascript:load(${p.page+1})">›</a></li>`;
  nav.innerHTML = html;
}

function updateResultInfo(p) {
  const from = (p.page - 1) * p.limit + 1;
  const to   = Math.min(p.page * p.limit, p.total);
  document.getElementById('result-info').textContent = p.total === 0 ? 'Aucun résultat' : `${from}–${to} sur ${p.total} utilisateurs`;
  document.getElementById('page-info').textContent   = p.total > 0 ? `Page ${p.page} / ${p.pages}` : '';
}

function openCreateModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent       = 'Nouvel utilisateur';
  document.getElementById('btn-submit-label').textContent = 'Créer';
  document.getElementById('pwd-label').innerHTML          = 'Mot de passe <span class="text-danger">*</span>';
  document.getElementById('pwd-hint').textContent         = '';
  document.getElementById('f-password').required          = true;
  document.getElementById('actif-wrapper').style.display  = 'none';
  clearModalForm();
  clearAlert('modal-alert');
  new bootstrap.Modal(document.getElementById('userModal')).show();
}

function openEditModal(id) {
  const u = allUsers.find(x => x.id === id);
  if (!u) return;
  editingId = id;
  document.getElementById('modalTitle').textContent       = "Modifier l'utilisateur";
  document.getElementById('btn-submit-label').textContent = 'Enregistrer';
  document.getElementById('pwd-label').innerHTML          = 'Nouveau mot de passe';
  document.getElementById('pwd-hint').textContent         = 'Laisser vide pour ne pas changer';
  document.getElementById('f-password').required          = false;
  document.getElementById('actif-wrapper').style.display  = 'flex';
  document.getElementById('f-prenom').value   = u.prenom;
  document.getElementById('f-nom').value      = u.nom;
  document.getElementById('f-login').value    = u.login;
  document.getElementById('f-role').value     = u.role;
  document.getElementById('f-password').value = '';
  document.getElementById('f-actif').checked  = u.actif;
  resetStrength();
  clearAlert('modal-alert');
  new bootstrap.Modal(document.getElementById('userModal')).show();
}

async function submitModal() {
  const prenom   = document.getElementById('f-prenom').value.trim();
  const nom      = document.getElementById('f-nom').value.trim();
  const login    = document.getElementById('f-login').value.trim();
  const role     = document.getElementById('f-role').value;
  const password = document.getElementById('f-password').value;
  const actif    = document.getElementById('f-actif').checked;
  if (!prenom || !nom || !login) { showAlert('modal-alert', 'danger', 'Prénom, nom et login sont obligatoires.'); return; }
  if (!editingId && !password)  { showAlert('modal-alert', 'danger', 'Le mot de passe est obligatoire.'); return; }
  if (password && password.length < 8) { showAlert('modal-alert', 'danger', 'Le mot de passe doit faire au moins 8 caractères.'); return; }
  setLoading('btn-submit', 'spinner-modal', true);
  clearAlert('modal-alert');
  try {
    let url, method, body;
    if (!editingId) {
      url = `${API}/admin/users.php`; method = 'POST';
      body = { prenom, nom, login, role, mot_de_passe: password };
    } else {
      url = `${API}/admin/users.php?id=${editingId}`; method = 'PUT';
      body = { prenom, nom, login, role, actif };
      if (password) body.mot_de_passe = password;
    }
    const res  = await fetch(url, { method, headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json();
    if (res.ok) { bootstrap.Modal.getInstance(document.getElementById('userModal')).hide(); notify.success('Succès', data.message); load(1); }
    else { showAlert('modal-alert', 'danger', data.error ?? 'Erreur.'); }
  } catch(e) { showAlert('modal-alert', 'danger', 'Impossible de contacter le serveur.'); }
  finally { setLoading('btn-submit', 'spinner-modal', false); }
}

async function toggleStatus(id, activate) {
  try {
    const res  = await fetch(`${API}/admin/users.php?id=${id}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ actif: activate }),
    });
    const data = await res.json();
    if (res.ok) { notify.success('Succès', activate ? 'Compte activé' : 'Compte désactivé'); load(1); }
    else { notify.error('Erreur', data.error ?? 'Erreur.'); }
  } catch(e) { notify.error('Erreur', 'Impossible de contacter le serveur.'); }
}

function openDeleteModal(id, name) {
  deletingId = id;
  document.getElementById('delete-name').textContent = name;
  new bootstrap.Modal(document.getElementById('deleteModal')).show();
}

document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
  if (!deletingId) return;
  setLoading('btn-confirm-delete', 'spinner-delete', true);
  try {
    const res  = await fetch(`${API}/admin/users.php?id=${deletingId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
    const data = await res.json();
    if (res.ok) { bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide(); notify.success('Supprimé', data.message); load(1); }
    else { notify.error('Erreur', data.error ?? 'Erreur.'); }
  } catch(e) { notify.error('Erreur', 'Impossible de contacter le serveur.'); }
  finally { setLoading('btn-confirm-delete', 'spinner-delete', false); deletingId = null; }
});

function checkStrength(val) {
  let score = 0;
  if (val.length >= 8) score++; if (val.length >= 12) score++;
  if (/[A-Z]/.test(val)) score++; if (/[0-9]/.test(val)) score++; if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [{ pct:'0%',color:'#e9ecef',label:'' },{ pct:'25%',color:'#dc3545',label:'Très faible' },{ pct:'50%',color:'#fd7e14',label:'Faible' },{ pct:'75%',color:'#ffc107',label:'Moyen' },{ pct:'90%',color:'#20c997',label:'Fort' },{ pct:'100%',color:'#198754',label:'Très fort' }];
  const lvl = levels[Math.min(score, 5)];
  document.getElementById('strength-fill').style.width = lvl.pct;
  document.getElementById('strength-fill').style.background = lvl.color;
  document.getElementById('strength-label').textContent = lvl.label;
  document.getElementById('strength-label').style.color = lvl.color;
}
function resetStrength() { document.getElementById('strength-fill').style.width='0%'; document.getElementById('strength-label').textContent=''; }
function togglePwd(inputId, btn) {
  const input = document.getElementById(inputId); const icon = btn.querySelector('i');
  if (input.type === 'password') { input.type='text'; icon.classList.replace('fa-eye','fa-eye-slash'); }
  else { input.type='password'; icon.classList.replace('fa-eye-slash','fa-eye'); }
}
function resetFilters() { document.getElementById('searchInput').value=''; document.getElementById('roleFilter').value=''; document.getElementById('actifFilter').value=''; load(1); }
function clearModalForm() { ['f-prenom','f-nom','f-login','f-password'].forEach(id => document.getElementById(id).value = ''); document.getElementById('f-role').value='UTILISATEUR'; document.getElementById('f-actif').checked=true; resetStrength(); }
function setTableLoading() { document.getElementById('tableBody').innerHTML='<tr><td colspan="7" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2"></span>Chargement…</td></tr>'; }
function showTableError(msg) { document.getElementById('tableBody').innerHTML=`<tr><td colspan="7" class="text-center text-danger py-4">${esc(msg)}</td></tr>`; }
function showAlert(id, type, msg) { const el=document.getElementById(id); el.className=`alert alert-${type}`; el.textContent=msg; }
function clearAlert(id) { const el=document.getElementById(id); el.className='d-none'; el.textContent=''; }
function setLoading(btnId, spinnerId, on) { document.getElementById(btnId).disabled=on; document.getElementById(spinnerId).classList.toggle('d-none',!on); }
function esc(s) { const d=document.createElement('div'); d.textContent=String(s??''); return d.innerHTML; }

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') load(1); });
load(1);
</script>
</body>
</html>
