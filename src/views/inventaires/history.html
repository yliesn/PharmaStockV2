<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historique Inventaires - PharmaStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    .inventory-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: .75rem;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
    }
    .inventory-item:hover { border-left-color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .inventory-item.completed { border-left-color: #059669; }
    .inventory-item.pending   { border-left-color: #f59e0b; }
    .inventory-title { font-size: 1rem; font-weight: 600; color: #1e293b; }
    .inventory-date  { font-size: 0.85rem; color: #64748b; }
    .status-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-completed { background: #d1fae5; color: #065f46; }
    .status-pending   { background: #fef3c7; color: #92400e; }
    .stat-line {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin-top: .75rem;
    }
    .stat-mini { font-size: 0.85rem; color: #64748b; }
    .stat-mini .val { font-weight: 600; color: #1e293b; }
    .empty-state { text-align: center; padding: 3rem 1rem; }
    .empty-state-icon { font-size: 3rem; color: #cbd5e1; margin-bottom: 1rem; }
  </style>
</head>
<body>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>
  <script src="../../assets/js/sidebar.js"></script>

  <!-- Contenu principal -->
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">Historique des Inventaires</h1>
      </div>
      <div class="ms-auto">
        <a href="create.html" class="btn btn-sm btn-primary">
          <i class="fas fa-plus me-1"></i>Créer un inventaire
        </a>
      </div>
    </div>
    <div class="content">

      <!-- En-tête -->
      <div class="d-flex align-items-center gap-3 mb-4">
        <div>
          <h4 class="fw-bold mb-0">Historique des Inventaires</h4>
          <p class="text-muted mb-0 small">Liste de tous les inventaires réalisés</p>
        </div>
      </div>

      <!-- Liste -->
      <div class="table-wrapper">
        <div id="inventoryList" class="p-3"></div>
        <div id="emptyState" class="empty-state" style="display:none;">
          <div class="empty-state-icon"><i class="fas fa-inbox"></i></div>
          <h5 class="fw-semibold">Aucun inventaire pour le moment</h5>
          <p class="text-muted">Créez votre premier inventaire pour commencer.</p>
          <a href="create.html" class="btn btn-primary">
            <i class="fas fa-plus me-1"></i>Créer un Inventaire
          </a>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script>
  const notify = new NotificationSystem({ position: 'top-right', duration: 5000 });
  const API_BASE = '/api';

  async function init() {
    const token = localStorage.getItem('jwt');
    if (!token) { window.location.href = '../../index.html'; return; }
    await loadInventories();
  }

  async function loadInventories() {
    try {
      const token = localStorage.getItem('jwt');
      const response = await fetch(`${API_BASE}/inventaires/list.php`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!response.ok) throw new Error('Erreur lors du chargement');

      const data = await response.json();

      if (data.inventaires.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('inventoryList').innerHTML = '';
      } else {
        document.getElementById('emptyState').style.display = 'none';
        displayInventories(data.inventaires);
      }
    } catch (error) {
      console.error('Erreur:', error);
      notify.error('Erreur', error.message);
    }
  }

  function displayInventories(inventories) {
    const listContainer = document.getElementById('inventoryList');
    listContainer.innerHTML = '';

    inventories.forEach(inv => {
      const formattedDate = new Date(inv.date_inventaire).toLocaleDateString('fr-FR', {
        year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });

      const statusClass       = inv.corrigee ? 'completed' : 'pending';
      const statusText        = inv.corrigee ? 'Validé ✓' : 'En cours';
      const statusBadgeClass  = inv.corrigee ? 'status-completed' : 'status-pending';

      const item = document.createElement('div');
      item.className = `inventory-item ${statusClass}`;
      item.onclick = () => {
        window.location.href = inv.corrigee
          ? `summary.html?id=${inv.id}`
          : `session.html?id=${inv.id}`;
      };

      item.innerHTML = `
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div>
            <div class="inventory-title">Inventaire du ${formattedDate}</div>
            <div class="inventory-date">Par <strong>${inv.prenom} ${inv.nom}</strong>
              ${inv.commentaire ? ` — ${inv.commentaire}` : ''}
            </div>
          </div>
          <span class="status-badge ${statusBadgeClass}">${statusText}</span>
        </div>
        <div class="stat-line">
          <span class="stat-mini"><i class="fas fa-box me-1"></i>Produits : <span class="val">${inv.total_lignes || 0}</span></span>
          <span class="stat-mini"><i class="fas fa-exclamation-triangle me-1"></i>Écarts : <span class="val">${inv.lignes_ecart || 0}</span></span>
          <span class="stat-mini"><i class="fas fa-arrow-up me-1"></i>Surplus : <span class="val">${inv.surplus_total || 0}</span></span>
          <span class="stat-mini"><i class="fas fa-arrow-down me-1"></i>Manques : <span class="val">${inv.manques_total || 0}</span></span>
        </div>`;

      listContainer.appendChild(item);
    });
  }

  init();
</script>
</body>
</html>
