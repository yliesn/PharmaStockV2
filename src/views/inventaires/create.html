<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Créer un Inventaire - PharmaStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>
  <script src="../../assets/js/sidebar.js"></script>

  <!-- Contenu principal -->
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">Créer un Inventaire</h1>
      </div>
    </div>
    <div class="content">

      <!-- En-tête -->
      <div class="d-flex align-items-center gap-3 mb-4">
        <a href="history.html" class="btn btn-sm btn-outline-secondary">← Retour</a>
        <div>
          <h4 class="fw-bold mb-0">Créer un Inventaire</h4>
          <p class="text-muted mb-0 small">Initier une nouvelle session d'inventaire</p>
        </div>
      </div>

      <!-- Formulaire -->
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="table-wrapper">
            <div class="px-4 py-3 border-bottom">
              <h6 class="fw-bold mb-0"><i class="fas fa-list-check me-2"></i>Informations de l'inventaire</h6>
            </div>
            <div class="p-4">
              <form id="createInventoryForm">
                <div class="mb-3">
                  <label for="date" class="form-label fw-semibold">Date</label>
                  <input type="text" class="form-control" id="date" readonly>
                  <div class="form-text">Date actuelle</div>
                </div>
                <div class="mb-3">
                  <label for="user" class="form-label fw-semibold">Utilisateur</label>
                  <input type="text" class="form-control" id="user" readonly>
                </div>
                <div class="mb-4">
                  <label for="commentaire" class="form-label fw-semibold">Commentaire <span class="text-muted fw-normal">(optionnel)</span></label>
                  <textarea class="form-control" id="commentaire" rows="3"
                    placeholder="Ex: Inventaire complet de la pharmacie…"></textarea>
                </div>

                <div class="alert alert-info">
                  <i class="fas fa-info-circle me-2"></i>
                  <strong>Attention :</strong> Une fois créé, l'inventaire chargera la liste complète de tous les produits.
                </div>

                <div class="d-flex justify-content-between gap-2 mt-4">
                  <a href="history.html" class="btn btn-outline-secondary px-4">Annuler</a>
                  <button type="submit" class="btn btn-primary px-4">
                    <i class="fas fa-check me-1"></i>Créer et commencer
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script>
  const notify = new NotificationSystem({ position: 'top-right', duration: 5000 });
  const API_BASE = '/api';

  async function init() {
    const token = localStorage.getItem('jwt');
    if (!token) { window.location.href = '../../index.html'; return; }

    const today   = new Date();
    const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    document.getElementById('date').value = today.toLocaleDateString('fr-FR', options);

    updateUserField();
  }

  async function updateUserField() {
    const token  = localStorage.getItem('jwt');
    const cached = JSON.parse(localStorage.getItem('user') || '{}');

    if (cached.prenom) {
      document.getElementById('user').value = cached.prenom + ' ' + cached.nom;
    }

    try {
      const response = await fetch(`${API_BASE}/user/me.php`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (response.ok) {
        const data = await response.json();
        const user = data.user;
        document.getElementById('user').value = user.prenom + ' ' + user.nom;
      }
    } catch (error) {
      console.error('Erreur:', error);
    }
  }

  document.getElementById('createInventoryForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const commentaire = document.getElementById('commentaire').value;
    const token = localStorage.getItem('jwt');
    if (!token) { window.location = '../../index.html'; return; }

    try {
      const response = await fetch(`${API_BASE}/inventaires/create.php`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          commentaire: commentaire || null,
          utilisateur_id: JSON.parse(localStorage.getItem('user')).id
        })
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'Erreur lors de la création');
      }

      const result = await response.json();
      notify.success('Succès', 'Inventaire créé avec succès !');

      setTimeout(() => {
        window.location.href = `session.html?id=${result.inventaire_id}`;
      }, 500);

    } catch (error) {
      console.error('Erreur:', error);
      notify.error('Erreur', error.message);
    }
  });

  init();
</script>
</body>
</html>
