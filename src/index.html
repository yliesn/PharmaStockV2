<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - PharmaStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root { --primary: #059669; --primary-hover: #047857; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f1f5f9 100%);
      font-family: "Inter","Segoe UI",system-ui,sans-serif;
      margin: 0;
    }
    .login-wrap {
      width: 100%; max-width: 400px;
      padding: 1rem;
    }
    .login-card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.25rem 2rem;
    }
    .brand-icon {
      width: 52px; height: 52px;
      background: #ecfdf5;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto .75rem;
    }
    .brand-icon i { font-size: 1.4rem; color: var(--primary); }
    .brand-name {
      font-size: 1.25rem; font-weight: 700; color: #0f172a;
      text-align: center; margin-bottom: .25rem;
    }
    .brand-sub {
      font-size: .8rem; color: #64748b;
      text-align: center; margin-bottom: 2rem;
    }
    .form-label { font-size: .825rem; font-weight: 600; color: #374151; margin-bottom: .375rem; }
    .form-control {
      border-radius: 8px;
      border-color: #e2e8f0;
      font-size: .875rem;
      padding: .55rem .875rem;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 .2rem rgba(5,150,105,.15);
    }
    .input-group-text {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #94a3b8;
      cursor: pointer;
    }
    .btn-login {
      background: var(--primary);
      border: none;
      color: #fff;
      width: 100%;
      padding: .65rem;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      margin-top: 1.5rem;
      transition: background .2s;
    }
    .btn-login:hover { background: var(--primary-hover); }
    .btn-login:disabled { opacity: .7; cursor: not-allowed; }
    .spinner {
      display: none;
      width: 17px; height: 17px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand-icon"><i class="fas fa-pills"></i></div>
    <div class="brand-name">PharmaStock</div>
    <div class="brand-sub">Gestion de stock pharmaceutique</div>

    <div class="mb-3">
      <label class="form-label" for="login">Identifiant</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-user fa-sm"></i></span>
        <input type="text" id="login" class="form-control" placeholder="Votre identifiant" autocomplete="username">
      </div>
    </div>

    <div class="mb-1">
      <label class="form-label" for="password">Mot de passe</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-lock fa-sm"></i></span>
        <input type="password" id="password" class="form-control" placeholder="Votre mot de passe" autocomplete="current-password">
        <span class="input-group-text" id="toggle-password" title="Afficher/masquer">
          <i class="fas fa-eye fa-sm"></i>
        </span>
      </div>
    </div>

    <button id="btn-login" class="btn-login">
      <span id="btn-text">Se connecter</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </div>
</div>

<script src="./assets/js/notifications.js"></script>
<script>
const API = './api';
const notify = new NotificationSystem({ position: 'top-right', duration: 4000 });

const btn          = document.getElementById('btn-login');
const spinner      = document.getElementById('spinner');
const btnText      = document.getElementById('btn-text');
const passwordInput = document.getElementById('password');
const togglePassword = document.getElementById('toggle-password');
const toggleIcon   = togglePassword.querySelector('i');

togglePassword.addEventListener('click', () => {
  const isPassword = passwordInput.type === 'password';
  passwordInput.type = isPassword ? 'text' : 'password';
  toggleIcon.classList.toggle('fa-eye');
  toggleIcon.classList.toggle('fa-eye-slash');
});

if (localStorage.getItem('jwt')) {
  window.location = '/views/dashboard.html';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') btn.click();
});

btn.addEventListener('click', async () => {
  const login    = document.getElementById('login').value.trim();
  const password = passwordInput.value;

  if (!login || !password) {
    notify.warning('Champs manquants', 'Veuillez remplir tous les champs.');
    return;
  }

  btn.disabled = true;
  spinner.style.display = 'inline-block';
  btnText.textContent = 'Connexion…';

  try {
    const res = await fetch(`${API}/login.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password }),
    });

    let data;
    try { data = await res.json(); } catch { throw new Error('Réponse invalide'); }

    if (!res.ok) {
      notify.error('Erreur', data.error || 'Identifiants invalides');
      return;
    }

    localStorage.setItem('jwt', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    notify.success('Succès', 'Connexion réussie');
    setTimeout(() => { window.location = '/views/dashboard.html'; }, 500);

  } catch (err) {
    notify.error('Erreur serveur', 'Serveur injoignable');
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = 'Se connecter';
  }
});
</script>

</body>
</html>
